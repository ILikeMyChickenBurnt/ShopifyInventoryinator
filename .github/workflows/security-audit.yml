name: Security Audit

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  schedule:
    # Run every Monday at 06:15 UTC (after typical Dependabot run)
    - cron: '15 6 * * 1'

permissions:
  contents: read
  # Required if we want to auto-create issues on scheduled failures
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (fail on high+)
        run: npm audit --audit-level=high

      # On scheduled runs, if the audit fails (moderate or higher found),
      # open a GitHub Issue so the team is notified even if no one is watching the workflow.
      - name: Create issue on scheduled audit findings
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Dependency security audit issues detected (${today})`,
              body: `The weekly security audit found moderate or higher severity vulnerabilities.\n\nPlease review the workflow run logs:\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`,
              labels: ['security', 'dependencies']
            });
